<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inventario Manual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-size: clamp(12px, 2vw, 16px); }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-white text-black flex items-center justify-center min-h-screen">
    <div class="w-full max-w-4xl p-2 sm:p-4 space-y-3">
        <!-- Hero Header -->
        <div class="bg-gradient-to-r from-gray-200 to-gray-300 p-4 rounded-lg border-l-4 border-red-500">
            <h1 class="text-lg sm:text-2xl font-bold text-gray-800">📦 Inventario</h1>
            <p class="text-xs text-gray-600" id="bdStatus">Cargando BD...</p>
        </div>

        <!-- Controls - Una línea -->
        <div class="grid grid-cols-3 gap-2">
            <input type="text" id="ubicInput" placeholder="Ubicación" class="p-2 border border-gray-400 rounded text-xs focus:outline-none focus:border-gray-600 bg-white">
            <button id="loadBdBtn" class="bg-gray-500 text-white p-2 rounded font-semibold text-xs hover:bg-gray-600 transition">📂 Cargar BD</button>
            <button onclick="exportExcel()" class="bg-gray-700 text-white p-2 rounded font-semibold text-xs hover:bg-gray-800 transition">📥 Exportar Excel</button>
        </div>

        <!-- Table -->
        <div class="rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-xs sm:text-sm border-collapse">
                    <thead class="bg-gray-200 border-b border-gray-400">
                        <tr>
                            <th class="p-2 text-left font-bold text-gray-800">SKU</th>
                            <th class="p-2 text-center font-bold text-gray-800 w-12">Fondo</th>
                            <th class="p-2 text-center font-bold text-gray-800 w-12">Cant.</th>
                            <th class="p-2 text-left font-bold text-gray-800">Descripción</th>
                            <th class="p-2 text-center w-6"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-300">
                    </tbody>
                    <!-- Add Row Button -->
                    <tr class="hover:bg-gray-100 border-t border-gray-300">
                        <td colspan="5" class="p-2 text-center">
                            <button onclick="addEmptyRow()" class="text-gray-600 hover:text-gray-800 font-bold text-lg w-8 h-8 flex items-center justify-center">+</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script>
        let database = {};
        let tableData = [];

        // Esperar a que XLSX esté disponible
        function waitForXLSX(callback) {
            if (typeof XLSX !== 'undefined') {
                callback();
            } else {
                setTimeout(() => waitForXLSX(callback), 100);
            }
        }

        // Cargar BD automáticamente al abrir
        window.addEventListener('load', () => {
            waitForXLSX(loadDefaultBD);
        });

        function loadDefaultBD() {
            fetch('ResultadosAPLICACIONDETIENDASCR179.xlsx')
                .then(r => r.arrayBuffer())
                .then(buffer => {
                    try {
                        const workbook = XLSX.read(buffer, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet);

                        database = {};
                        rows.forEach(row => {
                            const sku = (row['CODIGO SKU'] || '').toString().trim();
                            const desc = (row['DESCRIPCION'] || '').toString().trim();
                            if (sku && desc) {
                                database[sku] = desc;
                            }
                        });

                        const count = Object.keys(database).length;
                        document.getElementById('bdStatus').textContent = `✅ BD: ${count} productos`;
                    } catch(err) {
                        document.getElementById('bdStatus').textContent = '⚠️ Sin BD';
                    }
                })
                .catch(() => {
                    document.getElementById('bdStatus').textContent = '⚠️ Sin BD';
                });
        }

        // Input file oculto
        const bdInput = document.createElement('input');
        bdInput.type = 'file';
        bdInput.accept = '.xlsx,.xls,.csv';
        bdInput.style.display = 'none';

        bdInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    if (file.name.endsWith('.csv')) {
                        const text = ev.target.result;
                        const lines = text.split('\n');
                        database = {};
                        for (let i = 1; i < lines.length; i++) {
                            if (!lines[i].trim()) continue;
                            const [sku, desc] = lines[i].split(',').map(s => s.trim());
                            if (sku) database[sku] = desc || '';
                        }
                    } else {
                        const data = new Uint8Array(ev.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet);
                        database = {};
                        rows.forEach(row => {
                            const sku = (row['CODIGO SKU'] || row.SKU || '').toString().trim();
                            const desc = (row['DESCRIPCION'] || row.Descripción || '').toString().trim();
                            if (sku && desc) {
                                database[sku] = desc;
                            }
                        });
                    }
                    const count = Object.keys(database).length;
                    document.getElementById('bdStatus').textContent = `✅ BD: ${count} productos`;
                } catch(err) {
                    alert('Error: ' + err.message);
                }
            };

            if (file.name.endsWith('.csv')) {
                reader.readAsText(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
        });
        document.body.appendChild(bdInput);

        document.getElementById('loadBdBtn').addEventListener('click', () => bdInput.click());

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = tableData.map((row, i) => `
                <tr class="hover:bg-gray-50 border-b border-gray-300">
                    <td class="p-2"><input type="text" value="${row.sku}" onchange="updateRow(${i}, 'sku', this.value)" maxlength="10" class="w-full p-1 border border-gray-400 rounded text-xs focus:outline-none focus:border-gray-600 bg-white" placeholder="SKU"></td>
                    <td class="p-2"><input type="text" value="${row.fondo}" onchange="updateRow(${i}, 'fondo', this.value)" maxlength="2" class="w-full p-1 border border-gray-400 rounded text-xs text-center focus:outline-none focus:border-gray-600 bg-white" placeholder="00"></td>
                    <td class="p-2"><input type="text" value="${row.cant}" onchange="updateRow(${i}, 'cant', this.value)" maxlength="4" class="w-full p-1 border border-gray-400 rounded text-xs text-center focus:outline-none focus:border-gray-600 bg-white" placeholder="0"></td>
                    <td class="p-2"><input type="text" value="${row.desc}" class="w-full p-1 border border-gray-400 rounded text-xs bg-gray-100 focus:outline-none" readonly placeholder="Descripción"></td>
                    <td class="p-2 text-center"><button onclick="deleteRow(${i})" class="text-gray-400 hover:text-gray-600 font-bold text-sm">✕</button></td>
                </tr>
            `).join('');
        }

        function updateRow(i, field, value) {
            tableData[i][field] = value;
            if (field === 'sku') {
                const desc = database[value.trim()] || '';
                tableData[i].desc = desc;
            }
            renderTable();
        }

        function deleteRow(i) {
            tableData.splice(i, 1);
            renderTable();
        }

        function addEmptyRow() {
            tableData.push({ sku: '', desc: '', fondo: '', cant: '' });
            renderTable();
        }

        function exportExcel() {
            if (tableData.filter(r => r.sku).length === 0) {
                alert('Agrega al menos un SKU');
                return;
            }

            const ubicacion = document.getElementById('ubicInput').value.trim();
            const data = tableData.filter(r => r.sku).map(row => ({
                'Ubicación': ubicacion,
                'SKU': row.sku,
                'Fondo': row.fondo || 0,
                'Cantidad': row.cant || 0,
                'Descripción': row.desc,
                'Total': (parseInt(row.fondo) || 0) * (parseInt(row.cant) || 0)
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
            XLSX.writeFile(wb, `Inv_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // 1 fila inicial
        addEmptyRow();
    </script>
</body>
</html>
