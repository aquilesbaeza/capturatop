<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Inventario Manual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * { --primary: #1e40af; --surface: #f8fafc; --border: #cbd5e1; }
        body { font-size: clamp(12px, 2vw, 16px); }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="w-full max-w-4xl mx-auto p-2 sm:p-4 space-y-2 sm:space-y-4 pb-20">
        <!-- Header -->
        <div class="bg-white p-3 sm:p-4 rounded-lg shadow-sm border-l-4 sticky top-0 z-10" style="border-left-color: #1e40af;">
            <h1 class="text-lg sm:text-2xl font-bold text-slate-800">📦 Inventario</h1>
            <p class="text-xs text-slate-600" id="bdStatus">Cargando BD...</p>
        </div>

        <!-- Ubicación -->
        <div class="bg-white p-3 sm:p-4 rounded-lg shadow-sm">
            <label class="block text-xs font-semibold text-slate-700 mb-1">Ubicación</label>
            <input type="text" id="ubicInput" placeholder="Pasillo A" class="w-full p-2 border border-slate-300 rounded text-xs sm:text-sm focus:outline-none focus:border-blue-600">
        </div>

        <!-- Botón Exportar -->
        <button onclick="exportExcel()" class="w-full bg-blue-600 text-white p-2 sm:p-3 rounded font-semibold text-sm hover:bg-blue-700 transition" style="background-color: #1e40af;">📥 Exportar Excel</button>

        <!-- Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-xs sm:text-sm">
                    <thead class="bg-slate-100 border-b border-slate-300 sticky top-14">
                        <tr>
                            <th class="p-1 sm:p-2 text-left font-semibold text-slate-700">SKU</th>
                            <th class="p-1 sm:p-2 text-left font-semibold text-slate-700">Descripción</th>
                            <th class="p-1 sm:p-2 text-center font-semibold text-slate-700 w-12">Fondo</th>
                            <th class="p-1 sm:p-2 text-center font-semibold text-slate-700 w-12">Cant.</th>
                            <th class="p-1 sm:p-2 text-center w-6"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200">
                    </tbody>
                    <!-- Add Row Button -->
                    <tr class="hover:bg-slate-50">
                        <td colspan="5" class="p-1 sm:p-2 text-center">
                            <button onclick="addEmptyRow()" class="text-blue-600 hover:text-blue-800 font-bold text-lg sm:text-xl w-8 h-8 flex items-center justify-center" style="color: #1e40af;">+</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script>
        let database = {};
        let tableData = [];

        // Cargar BD automáticamente al abrir
        window.addEventListener('load', loadDefaultBD);

        function loadDefaultBD() {
            fetch('ResultadosAPLICACIONDETIENDASCR179.xlsx')
                .then(r => r.arrayBuffer())
                .then(buffer => {
                    try {
                        const workbook = XLSX.read(buffer, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet);

                        database = {};
                        rows.forEach(row => {
                            const sku = (row['CODIGO SKU'] || '').toString().trim();
                            const desc = (row['DESCRIPCION'] || '').toString().trim();
                            if (sku && desc) {
                                database[sku] = desc;
                            }
                        });

                        const count = Object.keys(database).length;
                        document.getElementById('bdStatus').textContent = `✅ BD cargada: ${count} productos`;
                    } catch(err) {
                        document.getElementById('bdStatus').textContent = '❌ Error cargando BD';
                    }
                })
                .catch(() => {
                    document.getElementById('bdStatus').textContent = '⚠️ BD no disponible (cargue manualmente)';
                });
        }

        // Cargar BD manual
        const bdInput = document.createElement('input');
        bdInput.type = 'file';
        bdInput.id = 'bdFile';
        bdInput.accept = '.xlsx,.xls,.csv';
        bdInput.style.display = 'none';

        bdInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    if (file.name.endsWith('.csv')) {
                        const text = ev.target.result;
                        const lines = text.split('\n');
                        database = {};
                        for (let i = 1; i < lines.length; i++) {
                            if (!lines[i].trim()) continue;
                            const [sku, desc] = lines[i].split(',').map(s => s.trim());
                            if (sku) database[sku] = desc || '';
                        }
                    } else {
                        const data = new Uint8Array(ev.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet);
                        database = {};
                        rows.forEach(row => {
                            const sku = (row['CODIGO SKU'] || row.SKU || '').toString().trim();
                            const desc = (row['DESCRIPCION'] || row.Descripción || '').toString().trim();
                            if (sku && desc) {
                                database[sku] = desc;
                            }
                        });
                    }
                    const count = Object.keys(database).length;
                    document.getElementById('bdStatus').textContent = `✅ BD cargada: ${count} productos`;
                } catch(err) {
                    alert('Error: ' + err.message);
                }
            };

            if (file.name.endsWith('.csv')) {
                reader.readAsText(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
        });
        document.body.appendChild(bdInput);

        // Botón oculto para cargar BD
        const loadBtn = document.createElement('button');
        loadBtn.innerHTML = '📂 Cargar BD';
        loadBtn.style.cssText = 'position:fixed;bottom:70px;right:10px;padding:8px 12px;background:#1e40af;color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;z-index:20;';
        loadBtn.onclick = () => bdInput.click();
        document.body.appendChild(loadBtn);

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = tableData.map((row, i) => `
                <tr class="hover:bg-slate-50">
                    <td class="p-1 sm:p-2"><input type="text" value="${row.sku}" onchange="updateRow(${i}, 'sku', this.value)" maxlength="10" class="w-full p-1 border border-slate-300 rounded text-xs focus:outline-none focus:border-blue-600" placeholder="SKU"></td>
                    <td class="p-1 sm:p-2"><input type="text" value="${row.desc}" class="w-full p-1 border border-slate-300 rounded text-xs bg-slate-100 focus:outline-none" readonly placeholder="Desc"></td>
                    <td class="p-1 sm:p-2"><input type="text" value="${row.fondo}" onchange="updateRow(${i}, 'fondo', this.value)" maxlength="2" class="w-full p-1 border border-slate-300 rounded text-xs text-center focus:outline-none focus:border-blue-600" placeholder="00"></td>
                    <td class="p-1 sm:p-2"><input type="text" value="${row.cant}" onchange="updateRow(${i}, 'cant', this.value)" maxlength="4" class="w-full p-1 border border-slate-300 rounded text-xs text-center focus:outline-none focus:border-blue-600" placeholder="0"></td>
                    <td class="p-1 sm:p-2 text-center"><button onclick="deleteRow(${i})" class="text-slate-400 hover:text-red-600 font-bold text-sm">✕</button></td>
                </tr>
            `).join('');
        }

        function updateRow(i, field, value) {
            tableData[i][field] = value;
            if (field === 'sku') {
                const desc = database[value.trim()] || '';
                tableData[i].desc = desc;
            }
            renderTable();
        }

        function deleteRow(i) {
            tableData.splice(i, 1);
            renderTable();
        }

        function addEmptyRow() {
            tableData.push({ sku: '', desc: '', fondo: '', cant: '' });
            renderTable();
        }

        function exportExcel() {
            if (tableData.filter(r => r.sku).length === 0) {
                alert('Agrega al menos un SKU');
                return;
            }

            const ubicacion = document.getElementById('ubicInput').value.trim();
            const data = tableData.filter(r => r.sku).map(row => ({
                'Ubicación': ubicacion,
                'SKU': row.sku,
                'Descripción': row.desc,
                'Fondo': row.fondo || 0,
                'Cantidad': row.cant || 0,
                'Total': (parseInt(row.fondo) || 0) * (parseInt(row.cant) || 0)
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
            XLSX.writeFile(wb, `Inv_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // 5 filas iniciales
        for (let i = 0; i < 5; i++) addEmptyRow();
    </script>
</body>
</html>
