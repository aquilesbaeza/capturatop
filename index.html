<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Inventario Manual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html { width: 100%; }
        body { width: 100%; margin: 0; padding: 0; font-size: 14px; overflow-x: hidden; }
        input, button, select { font-size: 16px !important; -webkit-appearance: none; }
        input { border-radius: 4px; }
        button { min-height: 44px; cursor: pointer; }
        th, td { padding: 8px 6px; }
        @media (max-width: 640px) {
            body { font-size: 13px; }
            th, td { padding: 6px 4px; }
        }
    </style>
</head>
<body class="bg-white text-black">
    <div class="w-full px-3 py-3 space-y-3 pb-6">
        <!-- Hero Header -->
        <div class="bg-gradient-to-r from-gray-200 to-gray-300 p-3 rounded-lg border-l-4 border-red-500">
            <h1 class="text-lg font-bold text-gray-800">📦 Inventario</h1>
            <p class="text-xs text-gray-600 mt-1" id="bdStatus">Cargando BD...</p>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-3 gap-2">
            <input type="text" id="ubicInput" placeholder="Ubicación" class="p-3 border border-gray-400 rounded text-sm focus:outline-none focus:border-gray-600 bg-white">
            <button id="loadBdBtn" class="bg-gray-500 text-white p-3 rounded font-semibold text-sm hover:bg-gray-600 active:scale-95 transition">📂 Cargar</button>
            <button onclick="exportExcel()" class="bg-gray-700 text-white p-3 rounded font-semibold text-sm hover:bg-gray-800 active:scale-95 transition">📥 Exportar</button>
        </div>

        <!-- Table -->
        <div class="rounded-lg overflow-hidden border border-gray-300">
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse">
                    <thead class="bg-gray-200 border-b border-gray-400">
                        <tr>
                            <th class="text-left font-bold text-gray-800">SKU</th>
                            <th class="text-center font-bold text-gray-800 w-14">Fondo</th>
                            <th class="text-center font-bold text-gray-800 w-14">Cant.</th>
                            <th class="text-left font-bold text-gray-800 flex-1">Descripción</th>
                            <th class="text-center w-8"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-300">
                    </tbody>
                    <!-- Add Row Button -->
                    <tr class="hover:bg-gray-100 border-t border-gray-300">
                        <td colspan="5" class="text-center p-2">
                            <button onclick="addEmptyRow()" class="text-gray-600 hover:text-gray-800 font-bold text-2xl w-10 h-10 flex items-center justify-center active:scale-90 transition">+</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script>
        let database = {};
        let tableData = [];

        // Esperar a que XLSX esté disponible
        function waitForXLSX(callback) {
            if (typeof XLSX !== 'undefined') {
                callback();
            } else {
                setTimeout(() => waitForXLSX(callback), 100);
            }
        }

        // Cargar BD automáticamente al abrir
        window.addEventListener('load', () => {
            waitForXLSX(loadDefaultBD);
        });

        function loadDefaultBD() {
            fetch('ResultadosAPLICACIONDETIENDASCR179.xlsx')
                .then(r => r.arrayBuffer())
                .then(buffer => {
                    try {
                        const workbook = XLSX.read(buffer, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet);

                        database = {};
                        rows.forEach(row => {
                            const sku = (row['CODIGO SKU'] || '').toString().trim();
                            const desc = (row['DESCRIPCION'] || '').toString().trim();
                            if (sku && desc) {
                                database[sku] = desc;
                            }
                        });

                        const count = Object.keys(database).length;
                        document.getElementById('bdStatus').textContent = `✅ BD: ${count} productos`;
                    } catch(err) {
                        document.getElementById('bdStatus').textContent = '⚠️ Sin BD';
                    }
                })
                .catch(() => {
                    document.getElementById('bdStatus').textContent = '⚠️ Sin BD';
                });
        }

        // Input file oculto
        const bdInput = document.createElement('input');
        bdInput.type = 'file';
        bdInput.accept = '.xlsx,.xls,.csv';
        bdInput.style.display = 'none';

        bdInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    if (file.name.endsWith('.csv')) {
                        const text = ev.target.result;
                        const lines = text.split('\n');
                        database = {};
                        for (let i = 1; i < lines.length; i++) {
                            if (!lines[i].trim()) continue;
                            const [sku, desc] = lines[i].split(',').map(s => s.trim());
                            if (sku) database[sku] = desc || '';
                        }
                    } else {
                        const data = new Uint8Array(ev.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet);
                        database = {};
                        rows.forEach(row => {
                            const sku = (row['CODIGO SKU'] || row.SKU || '').toString().trim();
                            const desc = (row['DESCRIPCION'] || row.Descripción || '').toString().trim();
                            if (sku && desc) {
                                database[sku] = desc;
                            }
                        });
                    }
                    const count = Object.keys(database).length;
                    document.getElementById('bdStatus').textContent = `✅ BD: ${count} productos`;
                } catch(err) {
                    alert('Error: ' + err.message);
                }
            };

            if (file.name.endsWith('.csv')) {
                reader.readAsText(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
        });
        document.body.appendChild(bdInput);

        document.getElementById('loadBdBtn').addEventListener('click', () => bdInput.click());

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = tableData.map((row, i) => `
                <tr class="hover:bg-gray-50 border-b border-gray-300">
                    <td><input type="text" value="${row.sku}" onchange="updateRow(${i}, 'sku', this.value)" maxlength="10" class="w-full p-2 border border-gray-400 rounded text-sm focus:outline-none focus:border-gray-600 bg-white" placeholder="SKU"></td>
                    <td><input type="number" value="${row.fondo}" onchange="updateRow(${i}, 'fondo', this.value)" maxlength="2" class="w-full p-2 border border-gray-400 rounded text-sm text-center focus:outline-none focus:border-gray-600 bg-white" placeholder="0"></td>
                    <td><input type="number" value="${row.cant}" onchange="updateRow(${i}, 'cant', this.value)" maxlength="4" class="w-full p-2 border border-gray-400 rounded text-sm text-center focus:outline-none focus:border-gray-600 bg-white" placeholder="0"></td>
                    <td><input type="text" value="${row.desc}" class="w-full p-2 border border-gray-400 rounded text-sm bg-gray-100 focus:outline-none" readonly placeholder="Descripción"></td>
                    <td class="text-center"><button onclick="deleteRow(${i})" class="text-gray-400 hover:text-gray-600 font-bold text-lg w-8 h-8 flex items-center justify-center active:scale-90 transition">✕</button></td>
                </tr>
            `).join('');
        }

        function updateRow(i, field, value) {
            tableData[i][field] = value;
            if (field === 'sku') {
                const desc = database[value.trim()] || '';
                tableData[i].desc = desc;
            }
            renderTable();
        }

        function deleteRow(i) {
            tableData.splice(i, 1);
            renderTable();
        }

        function addEmptyRow() {
            tableData.push({ sku: '', desc: '', fondo: '', cant: '' });
            renderTable();
        }

        function exportExcel() {
            if (tableData.filter(r => r.sku).length === 0) {
                alert('Agrega al menos un SKU');
                return;
            }

            const ubicacion = document.getElementById('ubicInput').value.trim();
            const data = tableData.filter(r => r.sku).map(row => ({
                'Ubicación': ubicacion,
                'SKU': row.sku,
                'Fondo': row.fondo || 0,
                'Cantidad': row.cant || 0,
                'Descripción': row.desc,
                'Total': (parseInt(row.fondo) || 0) * (parseInt(row.cant) || 0)
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
            XLSX.writeFile(wb, `Inv_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // 1 fila inicial
        addEmptyRow();
    </script>
</body>
</html>
